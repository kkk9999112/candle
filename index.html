<title>바이낸스 캔들 다운로드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f3f5f8; --card:#ffffff; --fg:#17202b; --muted:#5d6977; --line:#dce2ea; --soft:#eef1f5;
  --accent:#f0b90b; --accent-ink:#17202b; --up:#d93a3a; --down:#2a6fd6; --err:#c0392b; --ok:#1f8a4c;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --mono:ui-monospace,"SF Mono","Consolas",monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1318; --card:#1a2028; --fg:#e9eef4; --muted:#98a4b2; --line:#2a333e; --soft:#222a34;
  --up:#ef5b5b; --down:#4c8ff0; --err:#ef6b5e; --ok:#4cc27e; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font);
  padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.wrap{max-width:520px;margin:0 auto;display:grid;gap:12px}
h1{font-size:20px;margin:2px 2px 0;letter-spacing:-.02em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px}
.lbl{font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px}
input[type=text],input[type=date]{width:100%;font:16px var(--font);color:var(--fg);background:var(--soft);
  border:1px solid transparent;border-radius:10px;padding:11px 12px;min-height:46px}
input:focus{outline:2px solid var(--accent);outline-offset:0;background:var(--card)}
button{font-family:var(--font)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.symrow{display:flex;gap:8px}
.combo{position:relative;flex:1;min-width:0}
#sug{position:absolute;z-index:5;left:0;right:0;top:calc(100% + 4px);margin:0;padding:4px;list-style:none;
  background:var(--card);border:1px solid var(--line);border-radius:10px;max-height:280px;overflow-y:auto;
  box-shadow:0 8px 24px rgba(0,0,0,.14)}
#sug li{display:flex;justify-content:space-between;gap:10px;padding:11px 12px;border-radius:8px;cursor:pointer}
#sug li .tk{color:var(--muted);font:12px var(--mono)}
#sug li.act{background:var(--soft)}
#sug li.none{color:var(--muted);cursor:default}
.star{flex:none;width:48px;font-size:22px;border:0;border-radius:10px;background:var(--soft);color:var(--muted);cursor:pointer}
.star.on{color:var(--accent)}
.favhead{display:flex;justify-content:space-between;align-items:center}
.link{font-size:13px;font-weight:700;border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--line);
  background:transparent;color:var(--fg);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.favedit{display:grid;gap:6px}
.fr{display:grid;grid-template-columns:1fr 40px 40px auto;gap:6px;align-items:center;background:var(--soft);border-radius:10px;padding:6px 6px 6px 12px}
.fn{font-size:14px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ft{font:12px var(--mono);color:var(--muted);margin-left:6px;font-weight:400}
.fb{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font-size:13px;cursor:pointer;padding:0 10px}
.fb:disabled{opacity:.3;cursor:default}
.fb.del{color:var(--err)}
.empty{font-size:12.5px;color:var(--muted);margin:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:10px;padding:3px;gap:3px}
.seg button{font-size:14px;padding:9px 4px;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--fg);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.dates[hidden]{display:none}
.go{font-size:17px;font-weight:800;padding:15px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.go:disabled{opacity:.55}
#status{font-size:13px;color:var(--muted);margin:0;white-space:pre-line}
#status .err{color:var(--err)}
/* 결과 */
.res{display:grid;gap:12px}
.res[hidden]{display:none}
.symtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.symtabs .chip{white-space:nowrap}
.head{display:grid;gap:2px}
.head .nm{font-size:13px;color:var(--muted)}
.head .px{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.head .chg{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.head .note{font-size:11.5px;color:var(--muted)}
.up{color:var(--up)} .down{color:var(--down)}
.chartbox{position:relative;height:240px;touch-action:none}
.chartbox canvas{width:100%;height:100%;display:block}
#tip{font-size:12px;color:var(--muted);min-height:18px;font-variant-numeric:tabular-nums;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--soft);border-radius:10px;padding:9px 10px}
.stat p{margin:0}
.stat .k{font-size:11.5px;color:var(--muted)}
.stat .v{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.list .r{display:grid;grid-template-columns:1fr auto 64px 14px;gap:8px;align-items:center;padding:9px 0;
  border-top:1px solid var(--line);font-size:13.5px;font-variant-numeric:tabular-nums}
.list .r .t{color:var(--muted)}
.list .r .p{text-align:right}
.list .r .g{text-align:right;font-weight:700}
.bar{justify-self:end;width:6px;border-radius:2px;min-height:3px}
.save{font-size:15px;font-weight:700;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);cursor:pointer}
.liverow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.live{font-size:12.5px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--card);color:var(--muted);cursor:pointer}
.live .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.live.on{color:var(--fg);border-color:var(--ok)}
.live.on .dot{background:var(--ok);animation:pulse 1.6s infinite}
.live.wait .dot{background:var(--accent)}
#liveTxt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live.on .dot{animation:none}}
.foot{font-size:12px;color:var(--muted);margin:0 2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>바이낸스 캔들 다운로드</h1>

  <section class="card" aria-label="조회 조건">
    <div>
      <p class="lbl"><label for="sym">종목</label></p>
      <div class="symrow">
        <div class="combo">
          <input id="sym" type="text" value="BTC" autocomplete="off" spellcheck="false" enterkeyhint="search"
            role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sug" placeholder="비트코인, ㅇㄷㄹㅇ, pepe">
          <ul id="sug" role="listbox" hidden></ul>
        </div>
        <button type="button" class="star" id="star" aria-label="입력한 종목을 즐겨찾기에 추가">☆</button>
      </div>
    </div>

    <div>
      <div class="favhead"><p class="lbl" style="margin:0">즐겨찾기</p><button type="button" class="link" id="editFav">편집</button></div>
      <div class="chips" id="favs" style="margin-top:6px"></div>
      <p class="empty" id="favHint"></p>
    </div>

    <div>
      <p class="lbl">봉 종류</p>
      <div class="seg" id="iv">
        <button type="button" data-v="1h">1시간</button>
        <button type="button" data-v="4h">4시간</button>
        <button type="button" data-v="1d" class="on">1일</button>
      </div>
    </div>

    <div>
      <p class="lbl">기간</p>
      <div class="seg" id="range">
        <button type="button" data-v="365" class="on">1년</button>
        <button type="button" data-v="730">2년</button>
        <button type="button" data-v="1095">3년</button>
        <button type="button" data-v="custom">직접</button>
      </div>
      <div class="dates" id="dates" hidden>
        <div><p class="lbl"><label for="start">시작일</label></p><input id="start" type="date"></div>
        <div><p class="lbl"><label for="end">종료일</label></p><input id="end" type="date"></div>
      </div>
    </div>

    <div>
      <p class="lbl">시장</p>
      <div class="seg" id="mk">
        <button type="button" data-v="futures" class="on">선물(USDT-M)</button>
        <button type="button" data-v="spot">현물</button>
      </div>
    </div>

    <button class="go" id="go" type="button">조회하기</button>
    <p id="status" role="status"></p>
  </section>

  <section class="card res" id="res" hidden aria-label="조회 결과">
    <div class="symtabs" id="tabs"></div>
    <div class="head">
      <span class="nm" id="nm"></span>
      <span class="px" id="px"></span>
      <span class="chg" id="chg"></span>
      <span class="note" id="note"></span>
      <div class="liverow"><button type="button" class="live" id="live" aria-pressed="true"><span class="dot"></span>실시간</button><span id="liveTxt"></span></div>
    </div>
    <div class="seg" id="zoom">
      <button type="button" data-v="30">최근 30개</button>
      <button type="button" data-v="90" class="on">최근 90개</button>
      <button type="button" data-v="all">전체</button>
    </div>
    <div class="chartbox"><canvas id="cv" role="img" aria-label="캔들 차트와 거래량"></canvas></div>
    <p id="tip">차트를 누르거나 밀면 그 봉의 가격이 보여요</p>
    <div class="stats">
      <div class="stat"><p class="k">기간 최고</p><p class="v" id="sHi"></p></div>
      <div class="stat"><p class="k">기간 최저</p><p class="v" id="sLo"></p></div>
      <div class="stat"><p class="k">기간 수익률</p><p class="v" id="sRt"></p></div>
    </div>
    <div>
      <p class="lbl" style="margin-bottom:2px">최근 10개</p>
      <div class="list" id="list"></div>
    </div>
    <button class="save" id="save" type="button">엑셀로 저장 (조회한 종목 전체)</button>
  </section>

  <p class="foot" id="foot"></p>
</div>

<script>
// ───── 기본 설정 ─────
const MARKETS={
  spot:{name:"현물",url:"https://api.binance.com/api/v3/klines",limit:1000},
  futures:{name:"선물",url:"https://fapi.binance.com/fapi/v1/klines",limit:1500}
};
const HOUR=3600000,DAY=24*HOUR,KST=9*HOUR;
const INTERVALS={
  "1h":{name:"1시간",ms:HOUR,col:"시간(한국)",
    foot:"시간은 한국 시간이에요. 마지막 봉은 아직 진행 중이라 값이 계속 바뀌어요."},
  "4h":{name:"4시간",ms:4*HOUR,col:"시간(한국)",
    foot:"시간은 한국 시간이에요. 4시간봉은 1·5·9·13·17·21시에 시작해요. 마지막 봉은 진행 중이에요."},
  "1d":{name:"1일",ms:DAY,col:"날짜(UTC)",
    foot:"날짜는 UTC 기준이에요. 바이낸스의 하루는 한국 시간 오전 9시에 시작해요. 오늘 봉은 진행 중이에요."}
};
const FAV_KEY="binance_daily_favorites";
const $=id=>document.getElementById(id);
const S={iv:"1d",range:"365",mk:"futures",zoom:"90",results:[],cur:0,period:null};

// ───── 한글 종목명 ─────
const COIN_TXT=`BTC:비트코인:비트,빗코
ETH:이더리움:이더
XRP:리플:엑스알피
SOL:솔라나:솔
BNB:바이낸스코인:비앤비
DOGE:도지코인:도지
ADA:에이다:카르다노
TRX:트론
AVAX:아발란체
DOT:폴카닷
LINK:체인링크
POL:폴리곤:폴
LTC:라이트코인
BCH:비트코인캐시
ETC:이더리움클래식:이클
SHIB:시바이누:시바
TON:톤코인:톤
XLM:스텔라루멘:스텔라
ATOM:코스모스
UNI:유니스왑
NEAR:니어프로토콜:니어
APT:앱토스
ARB:아비트럼
OP:옵티미즘
SUI:수이
SEI:세이
HBAR:헤데라
FIL:파일코인
ICP:인터넷컴퓨터
AAVE:에이브
SAND:샌드박스
MANA:디센트럴랜드
AXS:엑시인피니티
VET:비체인
ALGO:알고랜드
EGLD:멀티버스엑스
INJ:인젝티브
TIA:셀레스티아
STX:스택스
IMX:이뮤터블엑스
GRT:더그래프
PEPE:페페
WLD:월드코인
ENA:에테나
ONDO:온도파이낸스:온도
JUP:주피터
BONK:봉크
FLOKI:플로키
TRUMP:오피셜트럼프:트럼프
CRV:커브
LDO:리도다오:리도
SNX:신세틱스
CHZ:칠리즈
ENS:이더리움네임서비스
KAVA:카바
ZIL:질리카
ONT:온톨로지
QTUM:퀀텀
IOTA:아이오타
NEO:네오
THETA:쎄타토큰:쎄타
XTZ:테조스
ZRX:제로엑스
BAT:베이직어텐션토큰
1INCH:1인치
GMT:스테픈
PENDLE:펜들
RENDER:렌더토큰:렌더
JTO:지토
PYTH:피스네트워크:피스
STRK:스타크넷
ZK:지케이싱크
NOT:낫코인
PAXG:팍스골드
WIF:도그위프햇`;
const COINS=COIN_TXT.split("\n").map(l=>{const [b,n,a]=l.split(":");return {base:b,name:n,alias:(a||"").split(",").filter(Boolean)}});
const BY_BASE=Object.fromEntries(COINS.map(c=>[c.base,c]));
const CHO="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const cho=s=>[...s].map(ch=>{const c=ch.charCodeAt(0)-0xAC00;return c>=0&&c<11172?CHO[Math.floor(c/588)]:ch}).join("");
const isCho=s=>/^[ㄱ-ㅎ]+$/.test(s);
const QUOTES=/(USDT|USDC|FDUSD)$/;
const baseOf=t=>{t=t.endsWith("USDT")?t.slice(0,-4):t;return /^1000[A-Z]/.test(t)?t.slice(4):t};
const nameOf=t=>(BY_BASE[baseOf(t)]||{}).name;
const label=t=>nameOf(t)||baseOf(t);

function searchCoins(q){
  q=q.trim();if(!q)return [];
  const up=q.toUpperCase().replace(/USDT$/,""),out=[];
  COINS.forEach(c=>{
    const ns=[c.name,...c.alias];let s=0;
    if(c.base===up)s=100;
    else if(ns.includes(q))s=95;
    else if(/^[A-Z0-9]+$/.test(up)&&c.base.startsWith(up))s=80;
    else if(ns.some(n=>n.startsWith(q)))s=75;
    else if(ns.some(n=>n.includes(q)))s=60;
    else if(isCho(q)&&ns.some(n=>cho(n).startsWith(q)))s=55;
    else if(isCho(q)&&ns.some(n=>cho(n).includes(q)))s=40;
    if(s)out.push([s,c]);
  });
  return out.sort((a,b)=>b[0]-a[0]).slice(0,8).map(x=>x[1]);
}
// 비트코인 → BTCUSDT, pepe → PEPEUSDT, ETHBTC는 그대로
function resolve(tok){
  tok=tok.trim();if(!tok)return "";
  const up=tok.toUpperCase();
  if(BY_BASE[up])return up+"USDT";
  const hit=COINS.find(c=>c.name===tok||c.alias.includes(tok));
  if(hit)return hit.base+"USDT";
  const pair=up.match(/^([A-Z0-9]+?)(BTC|ETH|BNB|EUR|TRY)$/);
  if(pair&&BY_BASE[pair[1]])return up;
  if(/^[A-Z0-9]+$/.test(up)&&!QUOTES.test(up))return up+"USDT";
  return up;
}

const sugEl=$("sug");let sugItems=[],sugIdx=-1;
const curToken=()=>symEl.value.slice(symEl.value.lastIndexOf(",")+1);
function openSug(){
  const q=curToken().trim();
  sugItems=searchCoins(q);sugIdx=sugItems.length?0:-1;
  const exact=sugItems.length&&(sugItems[0].name===q||sugItems[0].base+"USDT"===q.toUpperCase());
  if(!q||exact&&sugItems.length===1){closeSug();return}
  sugEl.innerHTML="";
  if(!sugItems.length){
    const r=resolve(q),li=document.createElement("li");li.className="none";
    li.textContent=/^[A-Z0-9]+$/.test(r)?`${r} 로 조회해요`:"목록에 없는 한글 이름이에요. 영문으로 입력하세요 (예: pepe)";
    sugEl.appendChild(li);
  }else sugItems.forEach((c,i)=>{
    const li=document.createElement("li");li.setAttribute("role","option");if(i===sugIdx)li.className="act";
    const a=document.createElement("span"),b=document.createElement("span");
    a.textContent=c.name;b.className="tk";b.textContent=c.base;li.append(a,b);
    li.addEventListener("pointerdown",e=>{e.preventDefault();pick(c)});
    sugEl.appendChild(li);
  });
  sugEl.hidden=false;symEl.setAttribute("aria-expanded","true");
}
function closeSug(){sugEl.hidden=true;symEl.setAttribute("aria-expanded","false");sugIdx=-1}
function pick(c){
  const v=symEl.value,head=v.slice(0,v.lastIndexOf(",")+1);
  const parts=head.split(",").map(s=>s.trim()).filter(Boolean);
  if(!parts.map(resolve).includes(c.base+"USDT"))parts.push(c.base);
  symEl.value=parts.join(", ");closeSug();drawFavs();
}
symEl.addEventListener("input",()=>{openSug();drawFavs()});
symEl.addEventListener("focus",openSug);
symEl.addEventListener("blur",()=>setTimeout(closeSug,120));
symEl.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&(sugEl.hidden||sugIdx<0)){e.preventDefault();closeSug();symEl.blur();run();return}
  if(sugEl.hidden||!sugItems.length)return;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    e.preventDefault();sugIdx=(sugIdx+(e.key==="ArrowDown"?1:-1)+sugItems.length)%sugItems.length;
    [...sugEl.children].forEach((li,i)=>li.classList.toggle("act",i===sugIdx));
  }else if(e.key==="Enter"){e.preventDefault();pick(sugItems[sugIdx])}
  else if(e.key==="Escape")closeSug();
});

// ───── 데이터 받기 ─────
async function fetchKlines(sym,startMs,endMs,onProgress,iv=S.iv,mk=S.mk){
  const {url,limit}=MARKETS[mk],step=INTERVALS[iv].ms,rows=[];let cur=startMs;
  while(cur<=endMs){
    const q=`${url}?symbol=${encodeURIComponent(sym)}&interval=${iv}&startTime=${cur}&endTime=${endMs}&limit=${limit}`;
    let res;
    try{res=await fetch(q)}catch(e){throw new Error("바이낸스에 연결하지 못했어요. 인터넷을 확인하거나 와이파이/데이터를 바꿔 보세요.")}
    if(!res.ok){
      const body=await res.text();
      if(res.status===451)throw new Error("지금 네트워크에서는 바이낸스 접속이 막혀 있어요(451).");
      if(body.includes("Invalid symbol"))throw Object.assign(new Error(`바이낸스 ${MARKETS[mk].name}에 없는 종목이에요.`),{invalid:true});
      throw new Error(`오류 ${res.status}`);
    }
    const data=await res.json();if(!data.length)break;
    rows.push(...data);cur=data[data.length-1][0]+step;
    if(onProgress)onProgress(rows.length);
    if(data.length<limit)break;
    await new Promise(r=>setTimeout(r,150));
  }
  return rows.map(k=>({t:k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5],q:+k[7],n:+k[8]}));
}

function period(){
  if(S.range==="custom"){
    const s=$("start").value,e=$("end").value;
    if(!s||!e)throw new Error("시작일과 종료일을 고르세요.");
    const a=Date.parse(s+"T00:00:00Z"),b=Date.parse(e+"T00:00:00Z")+DAY-1;
    if(a>b)throw new Error("시작일이 종료일보다 늦어요.");
    return {a,b,s,e};
  }
  const b=Date.now(),a=b-(+S.range)*DAY;
  return {a,b,s:isoDay(a+KST),e:isoDay(b+KST)};
}

function setStatus(lines){
  const st=$("status");st.innerHTML="";
  lines.forEach(([t,err])=>{const d=document.createElement("div");if(err)d.className="err";d.textContent=t;st.appendChild(d)});
}

async function run(){
  const syms=symbols();
  if(!syms.length){setStatus([["종목을 입력하세요.",1]]);return}
  let p;try{p=period()}catch(e){setStatus([[e.message,1]]);return}
  stopLive();
  $("go").disabled=true;
  const results=[],msgs=[],ivName=INTERVALS[S.iv].name;
  for(const sym of syms){
    const show=n=>setStatus([...msgs,[`${label(sym)} ${ivName}봉 받는 중… ${n?n.toLocaleString()+"개":""}`]]);
    show(0);
    try{
      let real=sym,rows;
      try{rows=await fetchKlines(sym,p.a,p.b,show)}
      catch(e){
        // 선물에서는 PEPE·SHIB 같은 코인이 1000PEPEUSDT처럼 1000개 단위로 거래돼서 한 번 더 찾아봄
        if(!(e.invalid&&S.mk==="futures"&&!sym.startsWith("1000")))throw e;
        real="1000"+sym;
        try{rows=await fetchKlines(real,p.a,p.b,show)}catch(e2){throw e}
      }
      if(!rows.length)msgs.push([`${label(sym)}: 이 기간에는 데이터가 없어요.`,1]);
      else results.push({sym:real,rows,iv:S.iv,mk:S.mk});
    }catch(e){msgs.push([`${label(sym)}: ${e.message}`,1])}
  }
  $("go").disabled=false;
  if(results.length)msgs.unshift([`${results.length}개 종목 · ${ivName}봉 · ${p.s} ~ ${p.e}`]);
  setStatus(msgs);
  if(!results.length){$("res").hidden=true;return}
  S.results=results;S.cur=0;S.period=p;S.pin=null;
  $("res").hidden=false;drawTabs();showCur();startLive();
  if(matchMedia("(max-width:700px)").matches)$("res").scrollIntoView({behavior:"smooth",block:"start"});
}

const fmtP=(n,ref=n)=>{const d=ref>=1000?2:ref>=1?4:ref>=0.01?6:8;return n.toLocaleString("en-US",{maximumFractionDigits:d})};
const pct=(a,b)=>{const v=(a/b-1)*100;return (v>0?"+":"")+v.toFixed(2)+"%"};
const cls=(a,b)=>a>b?"up":a<b?"down":"";
function tLabel(ms,iv,short){
  if(iv==="1d"){const d=new Date(ms);return short?(d.getUTCMonth()+1)+"/"+d.getUTCDate():isoDay(ms)}
  const d=new Date(ms+KST),md=(d.getUTCMonth()+1)+"/"+d.getUTCDate(),h=d.getUTCHours();
  return short?`${md} ${h}시`:`${md} ${String(h).padStart(2,"0")}:00`;
}

// 캔들 차트 (한국식: 상승 빨강, 하락 파랑)
const cv=$("cv"),ctx=cv.getContext("2d");let geo=null;
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function draw(){
  if(!S.results.length||$("res").hidden)return;
  const r=S.results[S.cur],all=r.rows;
  const rows=S.zoom==="all"?all:all.slice(-(+S.zoom));
  const W=cv.clientWidth,H=cv.clientHeight,dpr=window.devicePixelRatio||1;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  const UP=css("--up"),DN=css("--down"),GRID=css("--line"),MUT=css("--muted");
  const hi=Math.max(...rows.map(k=>k.h)),lo=Math.min(...rows.map(k=>k.l)),vm=Math.max(...rows.map(k=>k.v))||1;
  const axis=p=>p>=1000?(p/1000).toFixed(p>=1e5?0:1)+"K":p>=1?p.toFixed(2):p.toPrecision(3);
  ctx.font="11px "+css("--font");
  const padR=Math.ceil(Math.max(...[0,1,2,3].map(i=>ctx.measureText(axis(lo+(hi-lo)*i/3)).width)))+10;
  const top=8,ph=H*0.72,vh=H*0.17,cw=W-padR;
  const y=p=>top+(hi-p)/((hi-lo)||1)*(ph-top),bw=cw/rows.length;
  ctx.lineWidth=1;
  for(let i=0;i<=3;i++){
    const p=lo+(hi-lo)*i/3,yy=Math.round(y(p))+.5;
    ctx.strokeStyle=GRID;ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(cw,yy);ctx.stroke();
    ctx.fillStyle=MUT;ctx.fillText(axis(p),cw+5,yy+4);
  }
  const asLine=rows.length>200;
  rows.forEach((k,i)=>{
    const cx=i*bw+bw/2,col=k.c>=k.o?UP:DN,w=Math.max(1,bw*0.62);
    ctx.fillStyle=col;ctx.globalAlpha=.32;const vv=k.v/vm*vh;ctx.fillRect(cx-w/2,H-vv,w,vv);ctx.globalAlpha=1;
    if(asLine)return;
    ctx.strokeStyle=col;ctx.beginPath();ctx.moveTo(Math.round(cx)+.5,y(k.h));ctx.lineTo(Math.round(cx)+.5,y(k.l));ctx.stroke();
    const t=y(Math.max(k.o,k.c)),b=y(Math.min(k.o,k.c));ctx.fillRect(cx-w/2,t,w,Math.max(1,b-t));
  });
  if(asLine){
    ctx.strokeStyle=css("--fg");ctx.lineWidth=1.5;ctx.beginPath();
    rows.forEach((k,i)=>{const X=i*bw+bw/2,Y=y(k.c);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});ctx.stroke();ctx.lineWidth=1;
  }
  ctx.fillStyle=MUT;
  [0,Math.floor(rows.length/2)].forEach(i=>ctx.fillText(tLabel(rows[i].t,r.iv,true),Math.min(i*bw,cw-60),top+ph+13));
  const last=rows[rows.length-1],ly=Math.round(y(last.c))+.5;
  ctx.setLineDash([3,3]);ctx.strokeStyle=last.c>=last.o?UP:DN;ctx.beginPath();ctx.moveTo(0,ly);ctx.lineTo(cw,ly);ctx.stroke();ctx.setLineDash([]);
  geo={rows,bw,cw,y,H,iv:r.iv};
  const pi=S.pin==null?-1:rows.findIndex(k=>k.t===S.pin);
  if(pi<0){
    $("tip").textContent=asLine?"봉이 많아서 종가 선으로 보여줘요. 누르면 그 봉의 가격이 보여요":"차트를 누르거나 밀면 그 봉의 가격이 보여요";
    return;
  }
  const k=rows[pi],X=Math.round(pi*bw+bw/2)+.5;ctx.strokeStyle=MUT;ctx.setLineDash([2,3]);
  ctx.beginPath();ctx.moveTo(X,0);ctx.lineTo(X,H);ctx.stroke();ctx.setLineDash([]);
  $("tip").textContent=`${tLabel(k.t,r.iv)}  시 ${fmtP(k.o)}  고 ${fmtP(k.h)}  저 ${fmtP(k.l)}  종 ${fmtP(k.c)}`;
}
function inspect(e){
  if(!geo)return;
  const rc=cv.getBoundingClientRect(),x=e.clientX-rc.left,i=Math.min(geo.rows.length-1,Math.max(0,Math.floor(x/geo.bw)));
  S.pin=geo.rows[i].t;draw();
}

cv.addEventListener("pointermove",e=>{if(e.buttons||e.pointerType==="mouse")inspect(e)});

// ───── 실시간 (바이낸스 공개 웹소켓, 조회한 종목 전체) ─────
const WS_URL={spot:"wss://stream.binance.com:9443/stream?streams=",futures:"wss://fstream.binance.com/stream?streams="};
const L={on:true,ws:null,retryT:null,mode:"off",poll:null,renderT:null,last:0};
const hhmmss=ms=>new Date(ms+KST).toISOString().slice(11,19);
function liveEligible(){
  const r=S.results[0];if(!r||!S.period)return false;
  return S.period.b>=Date.now()-INTERVALS[r.iv].ms;     // 오늘(현재)까지 조회했을 때만
}
function liveUI(){
  const b=$("live"),t=$("liveTxt"),ok=liveEligible();
  b.hidden=!ok;b.setAttribute("aria-pressed",String(L.on));
  b.classList.toggle("on",L.on&&L.mode!=="off"&&L.mode!=="connecting");
  b.classList.toggle("wait",L.on&&L.mode==="connecting");
  b.lastChild.textContent=L.on?"실시간 켜짐":"실시간 꺼짐";
  t.textContent=!ok?"지난 기간이라 실시간 갱신은 없어요"
    :!L.on?"눌러서 켜면 계속 갱신돼요"
    :L.mode==="connecting"?"연결 중…"
    :L.mode==="poll"?`5초마다 갱신 중${L.last?" · "+hhmmss(L.last):""}`
    :L.mode==="ws"?(L.last?`마지막 갱신 ${hhmmss(L.last)}`:"연결됨"):"";
}
function mergeK(r,k){
  const rows=r.rows,last=rows[rows.length-1],step=INTERVALS[r.iv].ms;
  if(!last||k.t>last.t){
    if(last&&k.t-last.t>step){catchUp(r).then(scheduleRender);return}   // 빠진 봉이 있으면 다시 받아서 메움
    rows.push(k);
  }else if(k.t===last.t)rows[rows.length-1]=k;
  else{const i=rows.findIndex(x=>x.t===k.t);if(i>=0)rows[i]=k}
}
function scheduleRender(){
  L.last=Date.now();
  if(L.renderT)return;
  L.renderT=setTimeout(()=>{L.renderT=null;if(!$("res").hidden){showCur();liveUI()}},500);
}
function stopLive(){
  clearTimeout(L.retryT);clearInterval(L.poll);L.poll=null;
  if(L.ws){L.ws.onclose=L.ws.onerror=L.ws.onmessage=null;try{L.ws.close()}catch(e){}L.ws=null}
  L.mode="off";
}
function startLive(){
  stopLive();liveUI();
  if(!L.on||!liveEligible()||document.hidden)return;
  L.mode="connecting";liveUI();
  openWs();
}
// 실시간 연결(웹소켓). 실패하면 바로 5초 조회로 바꾸고, 30초마다 실시간 연결을 다시 시도
function openWs(){
  const r0=S.results[0];
  const streams=S.results.map(r=>`${r.sym.toLowerCase()}@kline_${r.iv}`).join("/");
  let ws,done=false;
  try{ws=new WebSocket(WS_URL[r0.mk]+streams)}catch(e){wsFailed();return}
  L.ws=ws;
  const fail=()=>{
    if(done)return;done=true;clearTimeout(openT);
    ws.onclose=ws.onerror=ws.onmessage=null;try{ws.close()}catch(e){}
    if(L.ws===ws)L.ws=null;
    wsFailed();
  };
  const openT=setTimeout(fail,5000);                  // 5초 안에 안 열리면 실패로 봄
  ws.onopen=()=>{clearTimeout(openT);clearInterval(L.poll);L.poll=null;L.mode="ws";liveUI()};
  ws.onmessage=ev=>{
    let m;try{m=JSON.parse(ev.data)}catch(e){return}
    const d=m.data||m;if(d.e!=="kline")return;
    const r=S.results.find(x=>x.sym===d.s);if(!r)return;
    const k=d.k;
    mergeK(r,{t:k.t,o:+k.o,h:+k.h,l:+k.l,c:+k.c,v:+k.v,q:+k.q,n:+k.n});
    scheduleRender();
  };
  ws.onerror=fail;ws.onclose=fail;
}
function wsFailed(){
  if(!L.on||document.hidden||!S.results.length)return;
  if(!L.poll)startPoll();
  clearTimeout(L.retryT);
  L.retryT=setTimeout(()=>{if(L.on&&!document.hidden&&L.mode==="poll")openWs()},30000);
}
// 5초마다 최근 봉을 다시 받아옴
function startPoll(){
  clearInterval(L.poll);L.mode="poll";liveUI();
  const tick=async()=>{
    for(const r of S.results){
      try{
        const step=INTERVALS[r.iv].ms;
        const ks=await fetchKlines(r.sym,Date.now()-2*step,Date.now(),null,r.iv,r.mk);
        ks.forEach(k=>mergeK(r,k));
      }catch(e){}
    }
    scheduleRender();
  };
  tick();L.poll=setInterval(tick,5000);
}
async function catchUp(r){
  const last=r.rows[r.rows.length-1];if(!last)return;
  try{(await fetchKlines(r.sym,last.t,Date.now(),null,r.iv,r.mk)).forEach(k=>mergeK(r,k))}catch(e){}
}
$("live").onclick=()=>{L.on=!L.on;if(L.on)Promise.all(S.results.map(catchUp)).then(()=>{scheduleRender();startLive()});else{stopLive();liveUI()}};
// 화면을 끄거나 다른 앱으로 가면 멈추고, 돌아오면 빠진 봉을 받아 이어서 갱신
document.addEventListener("visibilitychange",()=>{
  if(!S.results.length)return;
  if(document.hidden){stopLive();return}
  if(L.on&&liveEligible())Promise.all(S.results.map(catchUp)).then(()=>{scheduleRender();startLive()});
});

// ───── 엑셀 저장 ─────
$("save").onclick=()=>{
  if(typeof XLSX==="undefined"){setStatus([["엑셀 기능을 불러오지 못했어요. 인터넷 연결 후 새로고침하세요.",1]]);return}
  const wb=XLSX.utils.book_new();
  S.results.forEach(r=>{
    const col=INTERVALS[r.iv].col;let prev=null;
    const data=r.rows.map(k=>{const chg=prev?Math.round((k.c/prev-1)*10000)/100:null;prev=k.c;
      return {[col]:r.iv==="1d"?isoDay(k.t):new Date(k.t+KST).toISOString().slice(0,16).replace("T"," "),
        "시가":k.o,"고가":k.h,"저가":k.l,"종가":k.c,"거래량":k.v,"거래대금":k.q,"거래횟수":k.n,"등락률(%)":chg}});
    const ws=XLSX.utils.json_to_sheet(data);
    ws["!cols"]=[r.iv==="1d"?12:17,14,14,14,14,18,20,10,10].map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb,ws,r.sym.slice(0,31));
  });
  const fname=`바이낸스 캔들 다운로드(${S.period.s}~${S.period.e}).xlsx`;
  try{XLSX.writeFile(wb,fname);setStatus([[`저장했어요: ${fname}`]])}
  catch(e){setStatus([["이 브라우저에서는 파일 저장이 안 돼요. 크롬이나 사파리로 열어 보세요.",1]])}
};
</script>
